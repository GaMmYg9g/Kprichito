<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E85D8F" />
  <meta name="description" content="Kprichitos - Tienda de regalos, juguetes y artículos de cumpleaños." />
  <title>Kprichitos | Regalos y Cumpleaños</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-icon"><i class="fas fa-gift"></i></span>
        <h1 class="brand-name">Kprichitos</h1>
      </div>

      <div class="header-actions">
        <button id="installBtn" class="install-btn hidden" title="Instalar aplicación">
          <i class="fas fa-download"></i>
        </button>
        <button id="cartBtn" class="cart-btn" aria-label="Ver carrito">
          <i class="fas fa-shopping-cart"></i>
          <span id="cartBadge" class="cart-badge hidden">0</span>
        </button>
      </div>
    </div>

    <nav class="main-nav" aria-label="Secciones principales">
      <button class="nav-btn" data-section="articulos">
        <i class="fas fa-store"></i><span>Artículos</span>
      </button>
      <button class="nav-btn" data-section="ofertas">
        <i class="fas fa-tags"></i><span>Ofertas</span>
      </button>
    </nav>

    <!-- Buscador inteligente -->
    <div class="search-wrap">
      <i class="fas fa-magnifying-glass search-icon"></i>
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar por nombre, precio, tipo..."
        autocomplete="off"
        aria-label="Buscar productos"
      />
      <button id="searchClear" class="search-clear hidden" aria-label="Limpiar búsqueda">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="app-main">

    <!-- Sección Artículos -->
    <section id="seccion-articulos" class="seccion">
      <div class="sub-nav" role="tablist" aria-label="Categorías de artículos">
        <button class="sub-btn" data-cat="juguetes">
          <i class="fas fa-shapes"></i><span>Juguetes</span>
        </button>
        <button class="sub-btn" data-cat="regalos">
          <i class="fas fa-gift"></i><span>Regalos</span>
        </button>
        <button class="sub-btn" data-cat="cumpleanos">
          <i class="fas fa-birthday-cake"></i><span>Cumpleaños</span>
        </button>
        <button class="sub-btn" data-cat="escuela">
          <i class="fas fa-school"></i><span>Escuela</span>
        </button>
      </div>

      <div id="grid-productos" class="grid-productos"></div>
    </section>

    <!-- Sección Ofertas -->
    <section id="seccion-ofertas" class="seccion">
      <div class="ofertas-header">
        <h2 class="ofertas-title"><i class="fas fa-fire"></i> Ofertas del momento</h2>
        <p class="ofertas-sub">Precios especiales por tiempo limitado</p>
      </div>
      <div id="grid-ofertas" class="grid-ofertas"></div>
    </section>

  </main>

  <!-- ============ FAB INFO ============ -->
  <div class="info-wrapper">
    <div id="infoPanel" class="info-panel" aria-hidden="true">
      <a class="info-action" data-net="instagram" href="#" target="_blank" rel="noopener" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a class="info-action" data-net="whatsapp" href="#" target="_blank" rel="noopener" title="WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>
      <button class="info-action" data-net="maps" type="button" title="Ubicación">
        <i class="fas fa-location-dot"></i>
      </button>
      <a class="info-action" data-net="tel" href="#" title="Llamar">
        <i class="fas fa-phone"></i>
      </a>
    </div>
    <button id="infoBtn" class="info-fab" aria-label="Información de la tienda">
      <i class="fas fa-info"></i>
    </button>
  </div>

  <!-- ============ MODAL PRODUCTO ============ -->
  <div id="modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">
        <i class="fas fa-xmark"></i>
      </button>
      <div class="modal-img-wrapper">
        <img id="modalImg" alt="" />
      </div>
      <h3 id="modalTitle" class="modal-title"></h3>

      <div id="monedaSelector" class="moneda-selector hidden">
        <button class="moneda-opt active" data-moneda="USD">
          <span class="moneda-code">USD</span>
          <span class="moneda-precio" id="optPrecioUSD">$0</span>
        </button>
        <button class="moneda-opt" data-moneda="CUP">
          <span class="moneda-code">CUP</span>
          <span class="moneda-precio" id="optPrecioCUP">$0</span>
        </button>
      </div>

      <p id="modalPrice" class="modal-price hidden"></p>

      <div class="qty">
        <button id="qtyMinus" aria-label="Disminuir"><i class="fas fa-minus"></i></button>
        <span id="qtyValue">1</span>
        <button id="qtyPlus" aria-label="Aumentar"><i class="fas fa-plus"></i></button>
      </div>

      <p class="total">Total: <strong id="modalTotal"></strong></p>

      <button id="modalAddCart" class="btn-add-cart">
        <i class="fas fa-cart-plus"></i><span>Añadir al carrito</span>
      </button>

      <button id="modalConfirm" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i><span>Comprar ahora por WhatsApp</span>
      </button>
    </div>
  </div>

  <!-- ============ MODAL CARRITO ============ -->
  <div id="cartModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal cart-modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="cartClose" aria-label="Cerrar">
        <i class="fas fa-xmark"></i>
      </button>

      <h2 class="cart-title">
        <i class="fas fa-shopping-cart"></i>
        <span>Tu pedido</span>
      </h2>

      <div id="cartItems" class="cart-items"></div>

      <div id="cartEmpty" class="cart-empty">
        <i class="fas fa-basket-shopping"></i>
        <p>Tu carrito está vacío</p>
        <span>Agrega productos para empezar tu pedido</span>
      </div>

      <div id="cartFooter" class="cart-footer hidden">
        <div id="cartTotals" class="cart-totals"></div>

        <button id="cartCheckout" class="btn-whatsapp">
          <i class="fab fa-whatsapp"></i><span>Enviar pedido por WhatsApp</span>
        </button>

        <button id="cartClear" class="btn-clear">
          <i class="fas fa-trash-can"></i><span>Vaciar carrito</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL DIRECCIÓN ============ -->
  <div id="direccionModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal dir-modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="dirClose" aria-label="Cerrar">
        <i class="fas fa-xmark"></i>
      </button>

      <div class="dir-icon">
        <i class="fas fa-location-dot"></i>
      </div>

      <h3 class="dir-title">Nuestra ubicación</h3>
      <p class="dir-text" id="dirText"></p>

      <a id="dirMapBtn" class="btn-add-cart" href="#" target="_blank" rel="noopener">
        <i class="fas fa-map-location-dot"></i><span>Ver en el Mapa</span>
      </a>
    </div>
  </div>

  <!-- ============ LIGHTBOX ============ -->
  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">
      <i class="fas fa-xmark"></i>
    </button>
    <img id="lightboxImg" alt="" />
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast hidden"></div>

  <!-- ============ CONFETTI ============ -->
  <canvas id="confetti" class="confetti-canvas"></canvas>

  <!-- =====================================================
       SCRIPTS · El orden importa:
         1. products.js   → declara el contenedor PRODUCTOS
         2. juguetes.js   → llena PRODUCTOS.juguetes
         3. regalos.js    → llena PRODUCTOS.regalos
         4. cumpleanos.js → llena PRODUCTOS.cumpleanos
         5. escuela.js    → llena PRODUCTOS.escuela
         6. offers.js     → declara OFERTAS
         7. app.js        → usa todo
       ===================================================== -->
  <script src="js/products.js"></script>
  <script src="js/juguetes.js"></script>
  <script src="js/regalos.js"></script>
  <script src="js/cumpleanos.js"></script>
  <script src="js/escuela.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
